<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation Pivot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
      color: #94a3b8; transition: all 0.15s ease;
      text-decoration: none; cursor: pointer;
      border-left: 2px solid transparent;
    }
    .nav-link:hover { background: rgba(255,255,255,0.08); color: #ffffff; }
    .nav-link.active { background: rgba(255,255,255,0.12); color: #ffffff; border-left-color: #34d399; }
    .nav-link .icon { width: 15px; height: 15px; flex-shrink: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  </style>
</head>
<body class="min-h-screen font-sans" style="background:#f1f5f9">
  <div id="app"></div>
  <script src="/app.js?v=1"></script>
</body>
</html>
